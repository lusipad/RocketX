name: Desktop Build

# 打 v* 标签自动构建并准备草稿 Release；也可手动触发生成安装包产物
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_type == 'tag' && 'main' || github.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 核验发布标签来源与合同
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch origin main --tags
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          release_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$release_sha" = "$(git rev-parse origin/main)"
          git checkout --detach "$release_sha"
          node scripts/verify-release.mjs --tag "$RELEASE_TAG" --require-ready

      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 安装 Codex CLI
        run: npm install --global @openai/codex@0.144.4
      - name: 发布代码门禁
        run: |
          pnpm codex:protocol:check
          pnpm -r typecheck
          pnpm test:pure
          pnpm test:regression
          pnpm test:ecosystem
          pnpm package:plugins -- --out dist/plugins
          pnpm --filter @rcx/web build

  build:
    needs: gate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Linux 依赖（webkit2gtk 等）
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev libarchive-tools \
            squashfs-tools xvfb xdotool x11-utils imagemagick \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          # Windows full 会复制当前 node.exe；固定版本保证同一提交可重建相同运行时。
          node-version: ${{ matrix.platform == 'windows-latest' && '22.19.0' || '22' }}
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            plugins/intranet-link/native

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 准备固定版本 Codex 资源
        if: matrix.platform == 'windows-latest'
        run: pnpm prepare:codex

      - name: 准备并校验固定版本 DSH 运行时
        run: pnpm prepare:dsh-runtime

      - name: Rust 单元测试
        run: |
          cargo fmt --check --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo fmt --check --manifest-path plugins/intranet-link/native/Cargo.toml
          cargo check --locked --manifest-path plugins/intranet-link/native/Cargo.toml
          cargo test --locked --manifest-path plugins/intranet-link/native/Cargo.toml

      - name: 确保缓存中的 Linux AppRun 具备跨用户可执行权限
        if: matrix.platform == 'ubuntu-22.04'
        run: chmod 755 "${XDG_CACHE_HOME:-$HOME/.cache}"/tauri/AppRun-* 2>/dev/null || true

      - name: 构建桌面客户端
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 基础配置不引用 OCR 目录；Windows 在这里仅预生成供后续 full bundling 使用。
          ROCKETX_BUNDLE_OCR: ${{ matrix.platform == 'windows-latest' && '1' || '0' }}
        with:
          projectPath: apps/desktop
          # 打标签时创建草稿 Release 并上传安装包
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('RocketX {0}', github.ref_name) || '' }}
          releaseDraft: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: 生成 full 安装包
        if: matrix.platform == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $fullInstaller = ./scripts/package-full-setup.ps1 | Select-Object -Last 1
          if (-not (Test-Path -LiteralPath $fullInstaller -PathType Leaf)) {
            throw "Full setup was not generated: $fullInstaller"
          }

      - name: 核对各正式安装包内的 Pi 运行时和桥接脚本
        run: python scripts/verify-pi-installers.py

      - name: 验证 AppImage 跨用户离线无托盘启动与英文首屏
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          APPIMAGE="$(find apps/desktop/src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name 'RocketX_*_amd64.AppImage' | head -n 1)"
          test -n "$APPIMAGE"
          APPIMAGE="$(realpath "$APPIMAGE")"
          CLEAN_HOME="$(mktemp -d)"
          APID=""
          cleanup() {
            if [ -n "$APID" ]; then
              kill "$APID" 2>/dev/null || true
              sleep 1
              kill -9 "$APID" 2>/dev/null || true
            fi
            sudo rm -rf /tmp/rcx-root-appdir || true
            rm -rf "$CLEAN_HOME" /tmp/rcx-appimage.log /tmp/rcx-appimage-screen.png /tmp/rcx-ocr.tsv /tmp/rcx-ocr-eng.txt || true
          }
          trap cleanup EXIT

          sudo rm -rf /tmp/rcx-root-appdir
          sudo mkdir -p /tmp/rcx-root-appdir
          (cd /tmp/rcx-root-appdir && sudo "$APPIMAGE" --appimage-extract >/dev/null)
          test -x /tmp/rcx-root-appdir/squashfs-root/AppRun
          test -x /tmp/rcx-root-appdir/squashfs-root/AppRun.wrapped

          xvfb-run -a -s "-screen 0 1280x800x24" bash -euo pipefail -c '
            export HOME="'"$CLEAN_HOME"'"
            export XDG_CONFIG_HOME="'"$CLEAN_HOME"'/.config"
            export XDG_DATA_HOME="'"$CLEAN_HOME"'/.local/share"
            export LANG=C
            export LC_ALL=C
            export WEBKIT_DISABLE_DMABUF_RENDERER=1
            export WEBKIT_DISABLE_COMPOSITING_MODE=1
            /tmp/rcx-root-appdir/squashfs-root/AppRun >/tmp/rcx-appimage.log 2>&1 &
            APID=$!
            trap "kill $APID 2>/dev/null || true; pkill -9 -f /tmp/rcx-root-appdir 2>/dev/null || true" EXIT

            VISIBLE=""
            for _ in $(seq 1 25); do
              if ! kill -0 "$APID" 2>/dev/null; then
                echo "AppImage exited unexpectedly during startup:" >&2
                cat /tmp/rcx-appimage.log >&2 || true
                exit 1
              fi
              if xdotool search --onlyvisible --name "." >/dev/null 2>&1; then
                VISIBLE=1
                break
              fi
              sleep 1
            done
            if [ -z "$VISIBLE" ]; then
              echo "Timed out waiting for visible AppImage window:" >&2
              cat /tmp/rcx-appimage.log >&2 || true
              exit 1
            fi

            sleep 4
            if ! kill -0 "$APID" 2>/dev/null; then
              echo "AppImage exited right after showing window:" >&2
              cat /tmp/rcx-appimage.log >&2 || true
              exit 1
            fi
            import -window root /tmp/rcx-appimage-screen.png
            kill "$APID" 2>/dev/null || true
            wait "$APID" 2>/dev/null || true
            pkill -9 -f "/tmp/rcx-root-appdir" 2>/dev/null || true
          '

          convert /tmp/rcx-appimage-screen.png -resize 200% -colorspace Gray png:- \
            | OMP_THREAD_LIMIT=1 tesseract stdin stdout -l eng --psm 11 >/tmp/rcx-ocr-eng.txt 2>/dev/null
          convert /tmp/rcx-appimage-screen.png -resize 200% -colorspace Gray png:- \
            | OMP_THREAD_LIMIT=1 tesseract stdin stdout -l eng+chi_sim --psm 11 tsv >/tmp/rcx-ocr.tsv 2>/dev/null

          python3 - <<'PY'
          import re
          import subprocess

          stddev = float(subprocess.check_output(
              ["convert", "/tmp/rcx-appimage-screen.png", "-format", "%[fx:standard_deviation]", "info:"],
              text=True,
          ).strip())
          assert stddev > 0, f"Screenshot appears blank (standard_deviation={stddev})"

          with open("/tmp/rcx-ocr-eng.txt", encoding="utf-8", errors="replace") as f:
              eng_text = re.sub(r"\s+", " ", f.read()).strip()

          hard_re = re.compile(
              r"traceback|exception|segmentation fault|fatal|error while loading|glibc|not installed|"
              r"cannot open display|permission denied|no such file|"
              r"could not (?:load|find|open|start|initiali)|"
              r"failed to (?:load|start|open|initiali|create)|"
              r"cannot (?:load|find|open|execute|configure)|"
              r"unable to (?:load|find|open|start)|"
              r"command not found|core dumped",
              re.IGNORECASE,
          )
          soft_re = re.compile(
              r"error|failed|failure|could not|cannot|unable to|not found",
              re.IGNORECASE,
          )
          hard_match = hard_re.search(eng_text)
          assert not hard_match, f"OCR matched hard error pattern {hard_match.group(0)!r} in: {eng_text}"
          soft_match = soft_re.search(eng_text)
          assert not soft_match, f"OCR matched soft error pattern {soft_match.group(0)!r} in: {eng_text}"

          latin = 0
          han = 0
          with open("/tmp/rcx-ocr.tsv", encoding="utf-8", errors="replace") as f:
              lines = f.read().splitlines()[1:]
          for line in lines:
              parts = line.split("\t")
              if len(parts) < 12 or not parts[11].strip():
                  continue
              try:
                  conf = float(parts[10])
              except ValueError:
                  continue
              if conf < 80:
                  continue
              word = parts[11]
              latin += len(re.findall(r"[A-Za-z\u00c0-\u024f]", word))
              han += len(re.findall(r"[\u4e00-\u9fff\u3400-\u4dbf\u3040-\u30ff\uac00-\ud7af]", word))

          print(f"AppImage OCR check: stddev={stddev:.4f}, latin={latin}, han={han}")
          print(f"AppImage OCR text sample: {eng_text[:400]}")
          assert latin >= 15, f"Too few high-confidence Latin letters ({latin}); text: {eng_text}"
          assert 3 * han <= latin, f"Screenshot appears predominantly non-English (han={han}, latin={latin}); text: {eng_text}"
          PY

      - name: 上传 full 安装包到 Release
        if: github.ref_type == 'tag' && matrix.platform == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $fullInstaller = Join-Path (Resolve-Path 'apps/desktop/src-tauri/target/release/bundle/nsis').Path "RocketX_${version}_full-setup.exe"
          gh release upload "$env:GITHUB_REF_NAME" "$fullInstaller" --repo "$env:GITHUB_REPOSITORY" --clobber

      - name: 上传构建产物（手动触发时）
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: rocketx-${{ matrix.platform }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.rpm
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
          if-no-files-found: warn

  prepare-release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 核验三平台产物并准备草稿 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/verify-release.mjs --tag "$GITHUB_REF_NAME" --require-ready
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "true"
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release-assets
          pnpm package:plugins -- --tag "$GITHUB_REF_NAME" --out release-assets
          node scripts/verify-release-assets.mjs --tag "$GITHUB_REF_NAME" --directory release-assets
          gh release upload "$GITHUB_REF_NAME" release-assets/rocketx-plugins-${GITHUB_REF_NAME#v}.zip --repo "$GITHUB_REPOSITORY" --clobber
          cd release-assets
          find . -maxdepth 1 -type f ! -name '*.sig' ! -name 'SHA256SUMS.txt' -printf '%f\n' | sort | while read -r file; do
            sha256sum "$file"
          done > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cd ..
          node scripts/release-notes.mjs --tag "$GITHUB_REF_NAME" > RELEASE_NOTES.md
          gh release upload "$GITHUB_REF_NAME" release-assets/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --notes-file RELEASE_NOTES.md
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "true"
