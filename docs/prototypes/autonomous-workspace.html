<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>RocketX · 工作现场交互原型</title>
  <style>
    :root{color-scheme:dark;--primary:#527dff;--surface-1:#111317;--surface-2:#16181d;--surface-3:#1b1e24;--surface-4:#22262e;--text:#eef0f5;--muted:#a4adbd;--line:rgba(255,255,255,.10);--success:#59dbb2;--warning:#f3c779;--small:13px;--body:15px;--title:24px;--radius:10px}
    *{box-sizing:border-box}body{margin:0;background:var(--surface-3);color:var(--text);font:var(--body)/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,textarea{font:inherit}button{cursor:pointer;color:inherit;background:transparent;border:1px solid var(--line);border-radius:7px;padding:7px 12px}button:hover{background:var(--surface-4)}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,textarea:focus-visible{outline:2px solid var(--primary);outline-offset:3px}button.primary{background:var(--primary);color:white;border-color:var(--primary)}button.quiet{border-color:transparent}p{margin:8px 0}h1{font-size:var(--title);margin:8px 0;font-weight:650;line-height:1.4}h2{font-size:17px;margin:0 0 10px;font-weight:600}h3{font-size:var(--body);margin:0 0 8px}small,.muted{color:var(--muted);font-size:var(--small)}[hidden]{display:none!important}
    .prototype-bar{min-height:54px;display:flex;align-items:center;gap:16px;padding:9px 20px;border-bottom:1px solid var(--line);background:var(--surface-1);flex-wrap:wrap}.prototype-bar>span{margin-right:auto}.switcher{display:flex;gap:3px}.switcher button[aria-pressed="true"]{background:var(--surface-4);border-color:var(--primary)}.app{height:calc(100dvh - 54px);min-height:620px;display:grid;grid-template-columns:236px minmax(0,1fr)}.sidebar{background:var(--surface-2);border-right:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column;gap:8px}.brand{padding:0 12px 22px;font-size:20px;font-weight:600}.sidebar button{text-align:left;display:block;width:100%;border-color:transparent}.sidebar button[aria-current="page"]{background:var(--surface-4);border-color:var(--line)}.sidebar .section-label{margin:24px 12px 4px}.sidebar .work-label{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sidebar .footnote{margin-top:auto;padding:20px 12px 0}.main{min-width:0;overflow:auto}.home{max-width:900px;margin:auto;padding:60px 40px}.eyebrow{font-size:var(--small);color:var(--muted)}.home-intro{margin-bottom:30px}.home .prompt{margin:26px 0 36px}.home textarea{min-height:86px}.row{display:flex;align-items:center;gap:16px;padding:19px 0;border-bottom:1px solid var(--line)}.row>div{flex:1;min-width:0}.row p{margin:3px 0}.row button{flex-shrink:0}.tag{font-size:var(--small);color:var(--success)}.tag.attention{color:var(--warning)}.workspace{height:100%;display:flex;flex-direction:column}.work-header{padding:22px 30px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px}.work-header>div{flex:1;min-width:0}.work-header h1{font-size:20px}.work-header button{flex-shrink:0}.body{flex:1;min-height:0;display:flex}.conversation{flex:1;min-width:0;display:flex;flex-direction:column}.stream{overflow:auto;flex:1;padding:24px max(30px,calc((100% - 780px)/2))}.message{padding:0 0 24px;max-width:780px;overflow-wrap:anywhere}.message .author{font-size:var(--small);color:var(--muted);margin-bottom:7px}.message.user{padding:16px 18px;margin:0 0 24px;background:var(--surface-4);border-radius:var(--radius)}.message p{white-space:pre-wrap}.decision{border-left:3px solid var(--warning);padding:14px 18px;background:var(--surface-2);margin:0 0 24px}.decision .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.old-request{margin:18px 0 24px;color:var(--muted);font-size:var(--small)}.old-request button{margin:8px 0}.changes{border-bottom:1px solid var(--line);padding:20px 30px;background:var(--surface-2)}.changes .facts{display:flex;gap:26px;flex-wrap:wrap}.changes p{margin:4px 0}.changes h2{font-size:var(--body)}.composer-wrap{padding:16px 30px 22px;border-top:1px solid var(--line);background:var(--surface-3)}.composer{max-width:840px;margin:auto}.composer textarea,.home textarea{width:100%;resize:vertical;background:var(--surface-4);color:var(--text);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;min-height:78px;max-height:180px;display:block}.composer-footer{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}.composer-footer .send{margin-left:auto}.mode-group{display:flex;gap:3px}.mode-group button[aria-pressed="true"]{background:var(--surface-4);color:#a9bfff;border-color:#527dff80}.mode-hint{margin:8px 0 0;font-size:var(--small);color:var(--muted)}.queue{margin-bottom:12px;border-left:2px solid var(--primary);padding-left:12px}.queue-item{display:flex;align-items:center;gap:6px;margin:6px 0}.queue-item span{flex:1;overflow-wrap:anywhere}.queue-item button{padding:3px 7px}.artifact{width:360px;max-width:45%;overflow:auto;border-left:1px solid var(--line);background:var(--surface-2);padding:20px}.artifact header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.artifact header h2{margin:0}.artifact pre{font:13px/1.8 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface-1);padding:16px;border-radius:8px}.artifact li{margin-bottom:10px}.diff-add{color:var(--success)}.notice{padding:10px 14px;margin:0;background:var(--surface-2);border-top:1px solid var(--line);font-size:var(--small);color:var(--muted)}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:10px 18px;background:var(--surface-4);border:1px solid var(--line);border-radius:8px;max-width:90%;box-shadow:0 6px 24px #0006}.reset{font-size:var(--small)}
    @media(max-width:1100px){.app{grid-template-columns:205px minmax(0,1fr)}.artifact{max-width:none;position:absolute;right:0;top:0;bottom:0;width:min(390px,100%);z-index:2;box-shadow:-10px 0 30px #0005}.body{position:relative}.stream{padding:22px}.work-header,.composer-wrap{padding:18px 22px}}
    @media(max-width:650px){.prototype-bar{padding:10px 12px;gap:8px;font-size:var(--small)}.prototype-bar>span{width:100%}.switcher{flex:1}.switcher button{flex:1;font-size:var(--small);padding:6px}.reset{padding:6px}.app{display:block;height:auto;min-height:0}.sidebar{padding:10px 12px;display:flex;flex-direction:row;align-items:center;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}.brand,.sidebar .section-label,.sidebar .footnote{display:none}.sidebar button{width:auto;min-width:130px;flex-shrink:0}.sidebar button small{display:none}.main{min-height:calc(100dvh - 160px)}.workspace{height:calc(100dvh - 155px);min-height:530px}.work-header{padding:14px 16px;gap:8px;align-items:flex-start}.work-header h1{font-size:18px}.work-header button{padding:6px 8px}.stream{padding:18px 16px}.composer-wrap{padding:12px 16px}.changes{padding:14px 16px}.home{padding:28px 20px}.composer-footer{gap:5px}.mode-group button{font-size:var(--small);padding:6px 8px}.row{gap:10px}.notice{padding:8px 16px}}
  </style>
</head>
<body>
  <header class="prototype-bar">
    <span><strong>设计样例</strong> <span class="muted">· 仅本地交互，不连接任何 Agent</span></span>
    <div class="switcher" role="group" aria-label="选择结构方案">
      <button data-layout="conversation" aria-pressed="true">A · 对话与成果</button>
      <button data-layout="changes" aria-pressed="false">B · 变化与对话</button>
    </div>
    <button id="reset" class="reset quiet">重置样例</button>
  </header>
  <div class="app">
    <nav class="sidebar" aria-label="管家与工作">
      <div class="brand">RocketX</div>
      <button data-open="home">管家</button>
      <div class="section-label muted">我的工作 · 2</div>
      <button data-open="login"><span class="work-label">修复登录后返回原页面</span><small>RocketX · 正在验证（样例）</small></button>
      <button data-open="report"><span class="work-label">整理本周工作汇报</span><small>个人工作 · 等待补充（样例）</small></button>
      <p class="footnote muted">每项工作有自己的对话、草稿和成果。<br>所有数据都是设计样例。</p>
    </nav>
    <main class="main" id="main"></main>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
  <script>
    'use strict';
    const storageKey = 'rocketx-design-autonomous-workspace-v1';
    const exampleWorks = {
      login: { title: '修复登录后返回原页面', project: 'RocketX', state: '正在验证', running: true,
        goal: '用户登录后回到之前查看的页面，保留原来的筛选条件。',
        update: '已补上返回地址校验，正在检查过期登录和跨站地址。',
        decision: '登录已过期时，是否保留用户还没发送的草稿？',
        choices: ['保留草稿，登录后恢复', '不保留未发送内容'],
        messages: [{ author: '我', text: '修复登录后不能回到原页面的问题。保留筛选条件，验证后给我看改动。' },
          { author: '管家', text: '会沿用当前项目完成修复。返回地址会限制在站内，验证通过后把改动和检查结果放在这里。' },
          { author: '管家', text: '样例进展：返回地址和筛选条件已保留。过期登录场景里有一项体验选择需要你决定，其余检查继续进行。' }] },
      report: { title: '整理本周工作汇报', project: '个人工作', state: '等待补充', running: false,
        goal: '汇总已完成的工作、遗留问题和下周安排。', update: '已整理现有记录，等待确认汇报范围。',
        decision: '这份汇报面向谁？', choices: ['发给项目组，突出进展', '自己回顾，保留细节'],
        messages: [{ author: '我', text: '帮我整理一份本周的工作汇报。' }, { author: '管家', text: '样例记录已经整理成草稿。确认读者后，我会调整篇幅和措辞；当前没有发送到任何外部系统。' }] }
    };
    function freshState() { return { view:'home', layout:'conversation', homeDraft:'', works:Object.fromEntries(Object.keys(exampleWorks).map(id=>[id,{draft:'',mode:'queue',queue:[],messages:[],decision:null,artifact:false}])) }; }
    let state=freshState();
    try { const saved=JSON.parse(localStorage.getItem(storageKey)); if(saved && saved.works?.login && saved.works?.report) state=saved; } catch {}
    let toastTimer;
    const esc = value => String(value).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function save(){try{localStorage.setItem(storageKey,JSON.stringify(state));}catch{notify('当前浏览器无法保存；草稿只保留到页面关闭。');}}
    function notify(message){const el=document.getElementById('toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,4500);}
    function messageHTML(message){return `<article class="message ${message.author==='我'?'user':''}"><div class="author">${esc(message.author)}</div><p>${esc(message.text)}</p></article>`;}
    function openWork(id){state.view=id;save();render();document.querySelector('h1')?.focus();}
    function homeHTML(){return `<section class="home"><div class="home-intro"><div class="eyebrow">管家 · 所有内容为设计样例</div><h1 tabindex="-1">有什么事交给我？</h1><p class="muted">两项工作都留在这里。只有需要你决定或有成果时，再回来看看。</p></div><form id="home-form" class="prompt"><textarea id="home-draft" aria-label="交代给管家的事情" placeholder="交代新事情，或补充现有工作的要求…">${esc(state.homeDraft)}</textarea><div class="composer-footer"><span class="muted">原型会演示带入“修复登录”这项工作</span><button class="primary send" type="submit">交给管家</button></div></form><h2>需要你决定 <span class="muted">${Object.values(state.works).filter(w=>!w.decision).length}</span></h2>${Object.entries(exampleWorks).map(([id,w])=>`<div class="row"><div><span class="tag ${state.works[id].decision?'':'attention'}">${state.works[id].decision?'已回答':'有一个问题'}</span><p><strong>${esc(w.title)}</strong></p><small>${esc(state.works[id].decision ? state.works[id].decision : w.decision)}</small></div><button data-open="${id}">打开工作 →</button></div>`).join('')}<p class="muted" style="margin-top:24px">试一试：打开工作 → 补充要求 → 查看成果 → 切换另一项工作。两种结构保留相同的草稿与决定。</p></section>`;}
    function artifactHTML(work){return `<aside class="artifact" aria-label="成果辅助面板"><header><h2>成果与验证</h2><button id="close-artifact" aria-label="关闭成果面板">关闭</button></header><p class="eyebrow">设计样例 · 未连接真实文件或验证结果</p><h3>${state.view==='login'?'登录返回流程 · 草拟改动':'本周工作汇报 · 草稿'}</h3><p class="muted">${esc(work.goal)}</p>${state.view==='login'?'<pre>登录成功后\n<span class="diff-add">+ 返回之前的站内页面\n+ 恢复原页面的筛选条件\n+ 拒绝跨站返回地址</span></pre>':'<pre>本周完成\n· 登录流程问题定位\n· 工作现场交互方案\n\n下周计划\n· 以真实场景验证方案</pre>'}<h3>检查情况（样例）</h3><ul><li>已检查：正常登录后返回</li><li>待检查：登录过期后的恢复</li></ul><button id="comment-artifact">针对这份成果提修改</button><p class="muted">会把成果上下文带回当前输入框，等你发送。</p></aside>`;}
    function workHTML(){const work=exampleWorks[state.view],local=state.works[state.view];return `<section class="workspace"><header class="work-header"><div><div class="eyebrow">${esc(work.project)} · 已有工作样例</div><h1 tabindex="-1">${esc(work.title)}</h1><span class="tag">${work.state}（模拟）</span> <small>· 当前输入发给这项工作的管家</small></div><button id="toggle-artifact" aria-expanded="${local.artifact}">查看成果</button></header><div class="body"><div class="conversation">${state.layout==='changes'?`<section class="changes" aria-label="当前变化"><h2>当前变化</h2><p>${esc(work.update)}</p><div class="facts"><small>下一步：${local.decision?'按你的选择继续验证':'其余检查继续，等待你的决定'}</small><small>成果：1 份草稿 · 尚未交付</small></div></section>`:''}<div class="stream" id="stream">${work.messages.map(messageHTML).join('')}<section class="decision" aria-label="当前决定"><h3>${local.decision?'已记下你的决定':'需要你决定'}</h3><p>${esc(local.decision||work.decision)}</p>${local.decision?'<small>原型演示：已更新本地状态。没有发送外部指令。</small>':`<p class="muted">${state.view==='login'?'建议保留，避免重新输入；其余验证可以继续。':'按读者调整内容即可，不会自动对外发送。'}</p><div class="actions">${work.choices.map((choice,index)=>`<button data-decision="${index}" class="${index===0?'primary':''}">${esc(choice)}</button>`).join('')}</div>`}</section>${state.view==='login'?'<details class="old-request"><summary>较早的请求 · 已失效</summary><p>旧请求针对上一版草稿，已被当前版本替代。</p><button disabled aria-label="旧批准已失效">批准旧版本（已失效）</button></details>':''}${local.messages.map(messageHTML).join('')}</div><div class="composer-wrap"><form id="work-form" class="composer">${local.queue.length?`<div class="queue" aria-label="等待下一轮的要求"><small>接着做 · ${local.queue.length} 条等待要求（模拟）</small>${local.queue.map((text,index)=>`<div class="queue-item"><span>${esc(text)}</span><button type="button" data-edit="${index}" aria-label="编辑第 ${index+1} 条排队要求">编辑</button><button type="button" data-remove="${index}" aria-label="撤回第 ${index+1} 条排队要求">撤回</button></div>`).join('')}</div>`:''}<textarea id="work-draft" aria-label="补充这项工作的要求" placeholder="补充要求、回答问题，或让它修改成果…">${esc(local.draft)}</textarea><div class="composer-footer">${work.running?`<div class="mode-group" role="group" aria-label="要求生效时机"><button type="button" data-mode="steer" aria-pressed="${local.mode==='steer'}">立即调整</button><button type="button" data-mode="queue" aria-pressed="${local.mode==='queue'}">接着做</button></div>`:'<small>当前没有正在运行的任务</small>'}<button class="primary send" id="send" type="submit" ${local.draft.trim()?'':'disabled'}>${!work.running?'发送要求':local.mode==='steer'?'立即调整':'加入队列'}</button></div><p class="mode-hint">${!work.running?'发送后在当前工作记录中保留要求。':local.mode==='steer'?'立即调整当前步骤；本原型仅演示接收回执，不会中断或控制真实 Agent。':'等当前步骤结束后执行。可以编辑或撤回等待的要求。'} Enter 发送，Shift + Enter 换行。</p></form></div></div>${local.artifact?artifactHTML(work):''}</div></section>`;}
    function render(){document.getElementById('main').innerHTML=state.view==='home'?homeHTML():workHTML();document.querySelectorAll('[data-layout]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.layout===state.layout)));document.querySelectorAll('.sidebar [data-open]').forEach(el=>{if(el.dataset.open===state.view)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');});}
    function focusDraft(){const input=document.getElementById('work-draft');input?.focus();if(input)input.setSelectionRange(input.value.length,input.value.length);}
    document.addEventListener('input',event=>{if(event.target.id==='home-draft')state.homeDraft=event.target.value;if(event.target.id==='work-draft'){state.works[state.view].draft=event.target.value;document.getElementById('send').disabled=!event.target.value.trim();}save();});
    document.addEventListener('click',event=>{
      const button=event.target.closest('button');if(!button||button.disabled)return;
      if(button.dataset.open){openWork(button.dataset.open);return;}
      if(button.dataset.layout){state.layout=button.dataset.layout;save();render();return;}
      if(button.id==='reset'){localStorage.removeItem(storageKey);state=freshState();render();notify('已重置样例；只清除本原型的数据。');return;}
      if(state.view==='home')return;
      const work=exampleWorks[state.view],local=state.works[state.view];
      if(button.dataset.mode){local.mode=button.dataset.mode;save();render();focusDraft();return;}
      if(button.dataset.decision!==undefined){if(local.decision)return;local.decision=work.choices[Number(button.dataset.decision)];save();render();notify('决定已记录在当前工作中（模拟）。');focusDraft();return;}
      if(button.id==='toggle-artifact'||button.id==='close-artifact'){local.artifact=button.id==='close-artifact'?false:!local.artifact;save();render();document.getElementById(local.artifact?'close-artifact':'toggle-artifact')?.focus();return;}
      if(button.id==='comment-artifact'){local.draft+=(local.draft?'\n':'')+'关于这份成果：';local.artifact=false;save();render();focusDraft();return;}
      if(button.dataset.edit!==undefined){if(local.draft.trim()){notify('输入框已有草稿，请先发送或清空，再编辑排队要求。');focusDraft();return;}local.draft=local.queue.splice(Number(button.dataset.edit),1)[0];save();render();focusDraft();return;}
      if(button.dataset.remove!==undefined){local.queue.splice(Number(button.dataset.remove),1);save();render();notify('已撤回等待的要求（模拟）。');focusDraft();}
    });
    document.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='home-form'){if(!state.homeDraft.trim())return;const local=state.works.login;local.draft+=(local.draft?'\n':'')+state.homeDraft.trim();state.homeDraft='';openWork('login');focusDraft();notify('已将要求带到样例工作，请选择生效时机后发送。');return;}if(event.target.id!=='work-form')return;const local=state.works[state.view],work=exampleWorks[state.view],text=local.draft.trim();if(!text)return;if(work.running&&local.mode==='queue'){local.queue.push(text);notify('已加入当前工作队列（模拟），可以编辑或撤回。');}else{local.messages.push({author:'我',text},{author:'管家',text:work.running?'模拟回执：要求已接收，将调整当前步骤。真实执行器没有收到任何指令。':'模拟回执：要求已保存在这项工作中。真实执行器没有收到任何指令。'});notify('样例已演示接收回执。');}local.draft='';save();render();document.getElementById('stream').scrollTop=document.getElementById('stream').scrollHeight;focusDraft();});
    document.addEventListener('keydown',event=>{if(event.target.id==='work-draft'&&event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();document.getElementById('work-form').requestSubmit();}});
    render();
  </script>
</body>
</html>
